[package]
name = "ms-crtd"
version = "0.1.0-dev"
edition = "2021"
license = "MIT"
authors = ["zevs"]
description = "AD CS certificate-template parser and Certified Pre-Owned ESC1-ESC15 static-analysis engine"
readme = "README.md"
repository = "https://github.com/icedracon/ms-crtd"
homepage = "https://github.com/icedracon/ms-crtd"
documentation = "https://docs.rs/ms-crtd"
keywords = ["active-directory", "adcs", "certificate-template", "esc", "kerberos"]
categories = ["authentication", "parser-implementations"]

[dependencies]
bitflags = "2"
thiserror = "2"
hex = "0.4"

[lib]
name = "ms_crtd"
path = "src/lib.rs"
